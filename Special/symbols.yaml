name: "Symbols"
rowHeightMode: FillHeight
attributes:
  shiftable: false
rows:
  # iPhone-style ?123 page (Vietnamese: ₫ instead of $)
  - letters: "1 2 3 4 5 6 7 8 9 0"
    numRowMode: Hideable
  - letters:
      - "-"
      - "/"
      - ":"
      - ";"
      - "("
      - ")"
      - "₫"
      - "&"
      - "@"
      - "\""
  - letters:
      - "$shift"
      - "."
      - ","
      - "?"
      - "!"
      - "'"
      - "$delete"
    attributes:
      width: Grow
  - bottom: "$alphabet $action $space $enter"

