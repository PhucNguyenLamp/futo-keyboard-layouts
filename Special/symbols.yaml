name: "Symbols"
attributes:
  shiftable: false
rows:
  # iPhone-style ?123 page (Vietnamese: ₫ instead of $)
  - letters:
      - "-"
      - "/"
      - ":"
      - ";"
      - "("
      - ")"
      - "₫"
      - "&"
      - "@"
      - "\""
  - letters:
      - "$shift"
      - "."
      - ","
      - "?"
      - "!"
      - "'"
      - "$delete"
  - bottom: "$alphabet $space $enter"
