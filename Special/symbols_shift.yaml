name: "Symbols (Shifted)"
numberRowMode: UserConfigurable
attributes:
  shiftable: false
rows:
  # iPhone-style #+= page
  - letters: ["[", "]", "{", "}", "#", "%", "^", "*", "+", "="]
  - letters: ["_", "\\", "|", "~", "<", ">", "$", "¥", "€", "•"]
  - letters: ["$shift", ".", ",", "?", "!", "'", "$delete"]
  - bottom: "$alphabet $space $enter"
